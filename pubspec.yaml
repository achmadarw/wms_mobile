name: wms_mobile
description: 'Warehouse Management System - Flutter Mobile Application with barcode scanning, offline support, and full feature parity with web app.'
publish_to: 'none'

version: 1.0.0+1

environment:
    sdk: '>=3.0.0 <4.0.0'
    flutter: '>=3.13.0'

dependencies:
    flutter:
        sdk: flutter

    # Networking & API
    dio: ^5.3.1
    http: ^1.1.0

    # State Management
    riverpod: ^2.4.0
    flutter_riverpod: ^2.4.0
    hooks_riverpod: ^2.4.0

    # Local Storage & Caching
    hive: ^2.2.3
    hive_flutter: ^1.1.0
    shared_preferences: ^2.2.2
    sqflite: ^2.3.0

    # Barcode/QR Scanning
    mobile_scanner: ^3.5.0

    # Date/Time
    intl: ^0.19.0
    timezone: ^0.10.1

    # Utilities
    uuid: ^4.0.0
    logger: ^2.1.0
    path_provider: ^2.1.1

    # UI/UX Components
    google_fonts: ^6.1.0
    shimmer: ^3.0.0
    cached_network_image: ^3.3.1
    flutter_svg: ^2.0.7
    badges: ^3.1.1

    # State and Navigation
    go_router: ^13.0.0

    # JSON Serialization
    json_annotation: ^4.8.1

    # Platform-specific features
    device_info_plus: ^9.1.1
    connectivity_plus: ^5.0.1

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^3.0.0
    build_runner: ^2.4.6
    hive_generator: ^2.0.1
    json_serializable: ^6.7.1
    riverpod_generator: ^2.3.0

flutter:
    uses-material-design: true

    assets:
        - assets/
        - assets/icons/
        - assets/images/
        - assets/logos/
